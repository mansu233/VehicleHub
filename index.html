<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117"><title>VehicleHub</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#0d1117;--pn:#161c26;--ln:#263041;--tx:#e8edf5;--sb:#8b97aa;--ac:#f5a623;--ok:#2dd4bf;--wr:#f5a623;--bd:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:76px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 0;border-bottom:1px solid var(--ln)}
.top{display:flex;align-items:center;gap:8px}.brand{font-weight:800;letter-spacing:.5px;color:var(--ac)}
.top select{flex:1;min-width:0}.ib{background:var(--pn);border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:7px 10px;position:relative;font-size:15px}
.bg{position:absolute;top:-6px;right:-6px;background:var(--bd);border-radius:9px;font-size:11px;padding:0 5px}
.brand{display:flex;align-items:center;gap:6px}.logo{width:26px;height:26px}
.road{height:48px;position:relative;overflow:hidden;background:linear-gradient(90deg,var(--ln) 18px,transparent 18px) 0 44px/38px 2px repeat-x}
.car{position:absolute;top:24px;left:-14%;width:44px;overflow:visible;animation:go 40s linear infinite}.bob{animation:bob .9s ease-in-out infinite}
.wh{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}.sm{transform-box:fill-box;transform-origin:center;animation:puff 1.8s ease-out infinite}
.sig{position:absolute;left:73%;top:2px;width:14px;height:40px}.sgn{position:absolute;left:6%;top:4px;width:18px;height:38px}
.bld{position:absolute;bottom:4px;height:36px}.wk{left:21%;width:46px}.pt{left:41%;width:48px}.pump{animation:bl 2s steps(1) infinite}@keyframes bl{50%{opacity:.35}}
.lr{animation:sr 40s linear infinite}.ly{animation:sy 40s linear infinite}.lg{animation:sg 40s linear infinite}
@keyframes go{0%{left:-14%}47%,70%{left:56%}100%{left:105%}}@keyframes spin{47%,70%{transform:rotate(9600deg)}100%{transform:rotate(15700deg)}}
@keyframes bob{50%{transform:translateY(-.8px)}}@keyframes puff{0%{opacity:.7;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-16px,-9px) scale(2.2)}}
@keyframes sr{0%,49%{opacity:.18}50%,69%{opacity:1}70%,100%{opacity:.18}}@keyframes sy{0%,44%{opacity:.18}45%,49%{opacity:1}50%,100%{opacity:.18}}@keyframes sg{0%,44%{opacity:1}45%,69%{opacity:.18}70%,100%{opacity:1}}
@media(prefers-reduced-motion:reduce){.car,.bob,.wh,.sm,.lr,.ly,.lg,.pump{animation:none}.car{left:40%}}
main{padding:12px;max-width:640px;margin:auto}.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.hd{font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
input,select,button,textarea{font:inherit;color:var(--tx)}label{display:block;font-size:12px;color:var(--sb);margin-bottom:8px}
input:not([type=checkbox]),select{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:9px;margin-top:3px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac)}.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;background:var(--ac);color:#111;border:0;border-radius:10px;padding:11px;font-weight:700;margin-top:4px}.btn.g{background:var(--ln);color:var(--tx)}
.lk{background:none;border:0;color:var(--ac);font-weight:600;padding:2px 6px}.lk.d{color:var(--bd)}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:8px 2px;border-radius:9px;border:1px solid var(--ln);background:var(--bg)}.tabs .on{background:var(--ac);color:#111;font-weight:700}
.plate{display:inline-block;border:2px solid var(--tx);border-radius:6px;padding:1px 8px;font-weight:800;letter-spacing:1px;background:#f2f2f2;color:#111}
.big{font-size:30px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px}
.st b{display:block;font-size:19px}.st small,.sb{color:var(--sb);font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--ln)}.row:first-of-type{border-top:0}
.pill{font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px;background:#12332f;color:var(--ok);white-space:nowrap}.pill.warn{background:#3a2c0e;color:var(--wr)}.pill.bad{background:#3f1717;color:var(--bd)}
.al{padding:10px 12px;border-radius:12px;margin-bottom:12px;font-size:14px}.al.ok{background:#12332f}.al.warn{background:#3a2c0e}.al.bad{background:#3f1717}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--pn);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 0;font-size:11px;color:var(--sb)}nav button b{display:block;font-size:18px}nav .on{color:var(--ac)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto}.ov>div{background:var(--pn);border-radius:14px;padding:16px;width:100%;max-width:420px}
.hide{display:none!important}.ph{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ph img{width:100%;border-radius:10px;aspect-ratio:4/3;object-fit:cover}
.ck{display:flex;align-items:center;gap:6px;padding-top:20px}#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--tx);color:#111;padding:8px 14px;border-radius:20px;z-index:30}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}#lock>div{width:100%;max-width:320px;text-align:center}
#lock input{text-align:center;font-size:24px;letter-spacing:8px}

/* layout polish */
main{padding:14px 14px 96px}.card{padding:16px;margin-bottom:14px;border-radius:16px}.hd{font-size:16px;margin-bottom:12px}
header{padding:10px 14px 10px}.top{justify-content:space-between}.acts{display:flex;gap:8px}.vrow{padding-top:10px}.vrow select{margin:0;font-weight:600}
.hero{background:linear-gradient(135deg,#1c2536,#161c26)}.vn{font-size:20px;font-weight:800;margin-top:10px}.hero .big{margin-top:10px}
.grid{gap:10px;margin-bottom:14px}.st{padding:12px}.st small{display:block;margin-bottom:3px}.st b{font-size:19px}
.mrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:6px}.r5{text-align:right}.r5 b{display:block;font-size:22px;color:var(--ok)}
.row{padding:11px 0}.al{padding:12px 14px;margin-bottom:14px}label{margin-bottom:12px}.r2{gap:10px}.tabs button{padding:10px 2px}
</style></head><body>
<div id="lock" class="hide"><div><div class="brand" style="font-size:22px">VehicleHub</div><p class="sb">Enter your 6-character PIN</p>
<input id="pin" maxlength="6" autocomplete="off" autocapitalize="off"><p id="pinerr" class="sb" style="color:var(--bd)"></p>
<button class="btn" id="unlock">Unlock</button><button class="lk" id="forgot">Forgot PIN?</button></div></div>
<header><div class="top"><span class="brand"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="11" fill="#f5a623"/><path d="M8 30v-5l5-2 5-7h12l6 7 4 2v5z" fill="#0d1117"/><circle cx="16" cy="32" r="4.5" fill="#0d1117" stroke="#f5a623" stroke-width="2"/><circle cx="34" cy="32" r="4.5" fill="#0d1117" stroke="#f5a623" stroke-width="2"/></svg>VehicleHub</span><span class="acts"><button class="ib" id="bell" aria-label="Notifications">🔔<span class="bg hide" id="bgc"></span></button>
<button class="ib" id="vadd" aria-label="Add vehicle">＋</button><button class="ib" id="vdel" aria-label="Delete vehicle">🗑</button></span></div><div class="vrow"><select id="vsel" aria-label="Vehicle"></select></div></header>
<div class="road" aria-hidden="true"><svg class="bld wk" viewBox="0 0 46 36" aria-hidden="true"><rect x="2" y="12" width="42" height="24" fill="#263041"/><rect x="0" y="8" width="46" height="6" fill="#8b97aa"/><text x="23" y="7" font-size="6" font-weight="700" fill="#f5a623" text-anchor="middle">WORKSHOP</text><rect x="6" y="19" width="16" height="17" fill="#0d1117"/><path d="M6 24h16M6 29h16" stroke="#263041"/><circle cx="33" cy="22" r="6" fill="#f5a623"/><text x="33" y="25" font-size="8" text-anchor="middle">🔧</text></svg><svg class="bld pt" viewBox="0 0 48 36" aria-hidden="true"><rect x="1" y="4" width="46" height="8" rx="1" fill="#f5a623"/><text x="24" y="10.5" font-size="6" font-weight="700" fill="#111" text-anchor="middle">PETROL</text><rect x="5" y="12" width="2" height="24" fill="#8b97aa"/><rect x="41" y="12" width="2" height="24" fill="#8b97aa"/><rect x="19" y="18" width="10" height="18" rx="2" fill="#ef4444"/><rect class="pump" x="21" y="20" width="6" height="5" fill="#0d1117"/><path d="M29 24q5 0 5 6v6" fill="none" stroke="#e8edf5" stroke-width="1.5"/></svg><svg class="sgn" viewBox="0 0 18 40"><rect x="8" y="14" width="2" height="26" fill="#8b97aa"/><circle cx="9" cy="8" r="7" fill="#fff" stroke="#ef4444" stroke-width="2"/><text x="9" y="11" font-size="8" font-weight="700" text-anchor="middle" fill="#111">40</text></svg><svg class="sig" viewBox="0 0 14 40"><rect x="6" y="22" width="2" height="18" fill="#8b97aa"/><rect x="1" y="0" width="12" height="24" rx="3" fill="#0d1117" stroke="#8b97aa"/><circle class="lr" cx="7" cy="5.5" r="3" fill="#ef4444"/><circle class="ly" cx="7" cy="12" r="3" fill="#f5a623"/><circle class="lg" cx="7" cy="18.5" r="3" fill="#2dd4bf"/></svg><svg class="car" viewBox="0 0 64 32"><circle class="sm" cx="2" cy="22" r="2" fill="#8b97aa"/><circle class="sm" cx="2" cy="22" r="2" fill="#8b97aa" style="animation-delay:.6s"/><circle class="sm" cx="2" cy="22" r="2" fill="#8b97aa" style="animation-delay:1.2s"/><g class="bob"><path d="M3 22v-6l9-2 8-8h22l10 8 9 2v6z" fill="#f5a623"/><path d="M23 9h8v6H17zm10 0h9l7 6H33z" fill="#0d1117" opacity=".75"/><g class="wh"><circle cx="17" cy="24" r="6" fill="#0d1117" stroke="#e8edf5" stroke-width="2"/><path d="M17 19v10M12 24h10" stroke="#8b97aa" stroke-width="1.5"/></g><g class="wh"><circle cx="47" cy="24" r="6" fill="#0d1117" stroke="#e8edf5" stroke-width="2"/><path d="M47 19v10M42 24h10" stroke="#8b97aa" stroke-width="1.5"/></g></g></svg></div>
<main id="main"></main>
<div id="panel" class="ov hide"><div><div class="hd">Notifications <button class="lk" data-a="close">Close</button></div><div id="plist"></div></div></div>
<div id="modal" class="ov hide"><div><div class="hd"><span id="mt"></span><button class="lk" data-a="mclose">Close</button></div><div id="mb"></div></div></div>
<nav id="nav"></nav><div id="toast" class="hide"></div>
<script src="firebase-config.js"></script><script src="app.js"></script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')</script>
</body></html>
