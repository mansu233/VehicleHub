<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- car body -->
  <g transform="translate(66,180)">
    <path d="M20 118
             C10 118 2 110 2 100
             L2 78
             C2 68 8 60 18 56
             L48 44
             L78 10
             C84 4 92 0 100 0
             L280 0
             C290 0 298 4 304 12
             L330 46
             L360 54
             C372 58 380 68 380 80
             L380 100
             C380 110 372 118 362 118
             L340 118"
          fill="url(#accent)"/>
    <rect x="20" y="96" width="342" height="26" rx="10" fill="url(#accent)"/>

    <!-- windows -->
    <path d="M108 44 L134 12 L268 12 L292 44 Z" fill="#0F172A" opacity="0.85"/>
    <line x1="200" y1="12" x2="200" y2="44" stroke="#1E293B" stroke-width="6"/>

    <!-- wheels -->
    <circle cx="78" cy="120" r="34" fill="#0F172A"/>
    <circle cx="78" cy="120" r="16" fill="#94A3B8"/>
    <circle cx="304" cy="120" r="34" fill="#0F172A"/>
    <circle cx="304" cy="120" r="16" fill="#94A3B8"/>
  </g>

  <!-- wrench badge -->
  <g transform="translate(330,60) rotate(45)">
    <rect x="-14" y="0" width="28" height="120" rx="14" fill="#F8FAFC"/>
    <path d="M-14 0 a28 28 0 1 1 56 0 a28 28 0 0 1 -20 27
             l0 -14 a14 14 0 1 0 -16 0 l0 14
             a28 28 0 0 1 -20 -27 Z" fill="#F8FAFC"/>
    <rect x="-9" y="118" width="18" height="26" rx="6" fill="#F8FAFC"/>
  </g>
</svg>
